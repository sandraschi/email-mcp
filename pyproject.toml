[build-system]
requires = ["hatchling", "uv-dynamic-versioning>=0.7.0"]
build-backend = "hatchling.build"

[project]
name = "email-mcp"
version = "0.4.1"
description = "Multi-service email platform supporting SMTP/IMAP, SendGrid, Mailgun, Resend, local testing, and webhook integrations (FastMCP 3.2, Prefab UI)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Sandra Schipal", email = "sandraschipal@gmail.com" }
]
dependencies = [
    "fastapi>=0.115.0",
    "fastmcp>=3.4.4,<4",
    "pydantic>=2.0.0",
    "structlog>=24.0.0",
    "httpx>=0.25.0",
    "prefab-ui>=0.18.0",
]

[project.optional-dependencies]
anthropic = [
    "fastmcp[anthropic]",
]
test = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "aiosmtpd>=1.4.0",
]
dev = [
    "ruff>=0.16.0,<0.17",
    "mypy>=1.0.0",
    "build>=1.0.0",
    "pre-commit>=4.6.1",
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
]
[project.scripts]
email-mcp = "email_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/email_mcp"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "S", "UP", "RUF"]
ignore = ["S101", "B008", "S101", "B008", "S112", "S110", "S603", "S607", "S106", "S101", "B008", "S101", "B008", "S112", "S110", "S603", "S607", "S106", "RUF012", "S110", "S603", "S607", "S324", "E402", "S110", "S603", "S607", "E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
